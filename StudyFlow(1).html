<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"><title>StudyFlow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#eef1f6;--card:rgba(255,255,255,.94);--card-t:rgba(255,255,255,.72);--sf2:#e4e9f2;--tx:#101828;--mu:#475569;--pr:#2457d6;--pl:rgba(36,87,214,.12);--bd:#d0d8e6;--on:#fff;--ok:#15803d;--er:#b91c1c;--wa:#b45309;--scrim:rgba(238,241,246,.86);--sh:0 1px 2px rgba(16,24,40,.08);--fh:'Bricolage Grotesque',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0a0f1a;--card:rgba(15,22,36,.93);--card-t:rgba(15,22,36,.62);--sf2:#1b263b;--tx:#e9eef8;--mu:#a6b3ca;--pr:#6ea1ff;--pl:rgba(110,161,255,.14);--bd:#2a3750;--on:#07101f;--ok:#4ade80;--er:#f87171;--wa:#f5b942;--scrim:linear-gradient(90deg,rgba(6,10,18,.92),rgba(6,10,18,.74) 40%,rgba(6,10,18,.62));--sh:none}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;display:flex;overflow-x:hidden}
nav{width:230px;background:var(--card);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex-shrink:0;transition:transform .25s;z-index:20}
nav h1{font-size:20px;margin:4px 8px 14px;color:var(--pr)}
nav button{display:flex;gap:10px;align-items:center;background:none;border:0;color:var(--mu);font:inherit;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;min-height:44px}
nav button:hover{background:var(--pl)}nav button.on{background:var(--pr);color:var(--on)}
main{flex:1;min-width:0;overflow-y:auto;padding:24px;max-width:1100px;margin:0 auto}
.top{display:none;position:sticky;top:0}
h2{margin:0 0 16px;font-size:24px}h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.glass{background:linear-gradient(135deg,rgba(37,99,235,.9),rgba(96,165,250,.75));color:#fff;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat b{display:block;font-size:28px;color:var(--pr)}.stat span{color:var(--mu);font-size:13px}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer;min-height:44px}
.btn.g{background:var(--pl);color:var(--pr)}.btn.d{background:var(--er)}.btn.s{min-height:36px;padding:6px 10px;font-size:13px}
.btn:hover{filter:brightness(1.08)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);min-height:44px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--pl);color:var(--pr);white-space:nowrap}
.hi{color:var(--er)}.me{color:var(--wa)}.lo{color:var(--ok)}.mu{color:var(--mu)}.done .tt{text-decoration:line-through;opacity:.55}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--pr);background:none;color:#fff;cursor:pointer;flex-shrink:0}.ck.on{background:var(--ok);border-color:var(--ok);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.bar{height:10px;background:var(--pl);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);transition:width .4s}
.empty{text-align:center;color:var(--mu);padding:26px}.empty big{font-size:40px;display:block}
.ov{position:fixed;inset:0;background:rgba(5,10,25,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
#toasts{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px}
.ts{background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;animation:pop .3s;max-width:300px}.ts.err{background:var(--er);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{min-height:56px;padding:4px;border-radius:10px;background:var(--bg);font-size:12px;cursor:pointer;border:2px solid transparent}
.cal .h{min-height:0;background:none;text-align:center;color:var(--mu);cursor:default}.cal .sel{border-color:var(--pr)}.cal .td{background:var(--pl)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pr);margin:1px}
.ring{position:relative;width:240px;height:240px;margin:0 auto}.ring svg{transform:rotate(-90deg)}.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.heat i{aspect-ratio:1;border-radius:6px;background:var(--pl)}
.canvas{position:relative;height:240px}
.ic{width:18px;height:18px;stroke-width:2;flex-shrink:0;vertical-align:-3px}nav .ic{width:20px;height:20px}.ic.lg{width:24px;height:24px}.ic.xl{width:32px;height:32px}.ic.dl{color:var(--er)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}.chip{display:inline-flex;align-items:center;gap:4px}.ck{display:inline-flex;align-items:center;justify-content:center;padding:0}.ck .ic{width:16px;height:16px}.empty .ic{display:block;margin:0 auto 8px;color:var(--pr)}.logo{display:flex;align-items:center;gap:8px}.row>.ic,label .ic{vertical-align:-3px}
@media(max-width:780px){nav{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}nav.open{transform:none}.top{display:flex;position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--card);z-index:15;align-items:center;gap:10px}main{padding:70px 12px 20px}.cal div{min-height:44px}}
#mp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:340px;max-width:calc(100vw - 28px);max-height:min(80vh,560px);overflow-y:auto;z-index:40;margin:0}#mp[hidden]{display:none}

h1,h2,h3{font-family:var(--fh);letter-spacing:-.01em}h2{font-size:26px;font-weight:600}.num{font-variant-numeric:tabular-nums}

nav{width:208px;border-right:1px solid var(--bd)}nav h1{font-size:18px;color:var(--tx)}nav .logo svg{color:var(--pr)}nav button{border-radius:8px;min-height:40px;font-size:14px;padding:8px 10px}nav button:hover{background:var(--sf2);color:var(--tx)}nav button.on{background:var(--sf2);color:var(--tx);box-shadow:inset 3px 0 0 var(--pr)}
.btn{background:var(--pr);color:var(--on);border-radius:8px;font-weight:600;min-height:40px;transition:filter .15s,transform .1s}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{background:var(--sf2);filter:none}.btn.g.s{border-color:transparent;color:var(--mu);font-weight:500}.btn.g.s:hover{color:var(--tx)}.btn.d{background:var(--er);color:var(--on)}.btn.s{min-height:34px}
input,select,textarea{border-radius:8px;background:var(--sf2)}.ck.on{color:var(--on)}.chip{border-radius:6px}.bar{height:8px}.md{border-radius:12px;animation:in .18s}@keyframes in{from{opacity:0;transform:translateY(6px)}}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:16px;max-width:100%}.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:10px 12px;font:inherit;cursor:pointer;white-space:nowrap;min-height:44px}.tab:hover{color:var(--tx)}.tab.on{color:var(--tx);border-color:var(--pr);font-weight:600}

sdel:id=>{const n=['tasks','notes','exams','sessions'].reduce((a,k)=>a+S[k].filter(x=>x.subj===id).length,0),w=['plans','works','port','mats','goals'].reduce((a,k)=>a+S[k].filter(x=>x.subj===id).length,0);ask('Eliminar esta disciplina?'+(n+w?` ${n} tarefas, notas, exames ou sessões ficam sem disciplina e ${w} itens do espaço de trabalho (planos, trabalhos, portefólio, materiais, objetivos) serão removidos. Arquivar mantém tudo.`:''),()=>{S.subjects=S.subjects.filter(x=>x.id!==id);['tasks','notes','exams','sessions','events'].forEach(k=>S[k].forEach(x=>{if(x.subj===id)x.subj=''}));['plans','works','port','mats','goals'].forEach(k=>{S[k]=S[k].filter(x=>x.subj!==id)});if(curS===id)curS=null;save();render();toast('Disciplina eliminada')})}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.wst){S.works.find(x=>x.id===d.wst).status=t.value;save();render()}else if(d.wsub){S.works.find(x=>x.id===d.wsub).subs[+d.i].done=t.checked;save();render()}else if(d.ssort!=null){ssort=t.value;render()}else if(d.sarch!=null){sarch=t.checked;render()}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.sq!=null||d.mq!=null){if(d.sq!=null)sq=t.value;else mq=t.value;const p=t.selectionStart;render();const i=$(d.sq!=null?'#sq':'#mq');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.tagName!=='SELECT'&&b.tagName!=='INPUT'&&A[b.dataset.a])A[b.dataset.a](b.dataset.id,b)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.a==='sel')A.sel(e.target.dataset.id)});
let dbt;document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(d.f==='q'){F.q=t.value;$('#tl').innerHTML=taskList();icons()}else if(d.f==='nq'){nq=t.value;const p=t.selectionStart;render();const i=$('#nq');i.focus();i.setSelectionRange(p,p)}
else if(d.n){const n=S.notes.find(x=>x.id===curNote);n[d.n]=t.value;n.upd=new Date().toISOString();clearTimeout(dbt);dbt=setTimeout(()=>{save();const u=$('#nu');if(u)u.textContent='Guardado automaticamente · '+fmt(n.upd)},400)}
else if(d.s&&t.type==='number'){const v=parseInt(t.value);if(v>=1&&v<=+t.max){S.settings[d.s]=v;if(!S.timer.run&&d.s!=='goal')S.timer.left=phDur(S.timer.phase);save()}}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.f&&d.f!=='q'&&d.f!=='nq'){F[d.f]=t.value;render()}else if(d.n==='subj'){const n=S.notes.find(x=>x.id===curNote);n.subj=t.value;save()}
else if(d.s&&t.type==='checkbox'){S.settings[d.s]=t.checked;save();render()}else if(d.a==='psub')A.psub(null,t);else if(d.a==='xtopic')A.xtopic(d.id,t);
else if(t.id==='imp'){const f=t.files[0];if(!f)return;if(f.size>5e6)return toast('Ficheiro demasiado grande.','err');const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!Array.isArray(o.tasks)||!Array.isArray(o.subjects))throw 0;S=merge(o,def());fixPet();save();render();toast('Cópia importada')}catch(x){toast('Ficheiro inválido: não é uma cópia do StudyFlow.','err')}};r.readAsText(f)}});
setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('pt-PT');const T=S.timer;if(T.run){const l=tmLeft();if(l<=0)return finish(false);const e=$('#tm');if(e){e.textContent=tstr(l);const a=$('#arc');if(a)a.style.strokeDashoffset=2*Math.PI*108*(1-l/phDur(T.phase))}document.title=tstr(l)+' · StudyFlow'}else document.title='StudyFlow'},500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.timer.run&&tmLeft()<=0)finish(false)});
(()=>{const v=$('#bgv');if(!v)return;const lim=matchMedia('(prefers-reduced-motion:reduce)').matches||(navigator.connection&&navigator.connection.saveData)||(navigator.deviceMemory&&navigator.deviceMemory<=2);if(lim){v.pause();v.style.display='none';return}v.muted=true;const pr=v.play();pr&&pr.catch&&pr.catch(()=>{});v.addEventListener('error',()=>{v.style.display='none'});document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause();else v.play().catch(()=>{})})})();
if(S.timer.run&&tmLeft()<=0)finish(false);else render();
